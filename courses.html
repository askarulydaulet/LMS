<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStudy - Курсы</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><i data-lucide="graduation-cap"></i> <span>OpenStudy</span></div>
        <nav>
            <a href="index.html"><i data-lucide="home"></i> Главная</a>
            <a href="courses.html" class="active"><i data-lucide="graduation-cap"></i> Курсы</a>
            <a href="teacher-assignments.html"><i data-lucide="bar-chart-2"></i> Задания</a>
            <a href="#"><i data-lucide="star"></i> Оценки</a>
            <a href="#"><i data-lucide="settings"></i> Настройки</a>
            <a href="#" onclick="logout()"><i data-lucide="log-out"></i> Выход</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="user-welcome">
                <div class="avatar-placeholder">
                    <i data-lucide="user"></i>
                </div>
                <div>
                    <h1 id="user-name">Загрузка...</h1>
                    <p>Здесь Вы можете видеть и редактировать Ваши курсы</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="search-bar"><i data-lucide="search"></i><input type="text" placeholder="Поиск..."></div>
                <div class="icon-btn"><i data-lucide="bell"></i></div>
                <div class="avatar-small">
                    <i data-lucide="user"></i>
                </div>
            </div>
        </header>

        <section class="courses-section">
            <div class="section-header">
                <h2>Список ваших курсов</h2>
                <div class="controls"> <i data-lucide="plus-circle"></i></div>
            </div>
            <div id="courses-grid" class="courses-list">
            </div>
        </section>
    </main>
</div>

<script>
    // 1. Инициализация и переменные
    let allCourses = []; // Здесь будем хранить полный список курсов
    const user = JSON.parse(localStorage.getItem('currentUser'));
    const grid = document.getElementById('courses-grid');
    const searchInput = document.querySelector('.search-bar input');

    // Отображение имени
    if (user) {
        document.getElementById('user-name').textContent = `${user.lastName} ${user.firstName}`;
    }

    // 2. Функция для отрисовки курсов (вынесена отдельно, чтобы вызывать при поиске)
    function renderCourses(coursesToRender) {
        if (coursesToRender.length === 0) {
            grid.innerHTML = `<p style="padding: 20px; color: var(--text-gray);">Курсы не найдены...</p>`;
            return;
        }

        grid.innerHTML = coursesToRender.map(course => `
            <div class="course-card">
                <div class="course-icon-box"><i data-lucide="${course.icon}"></i></div>
                <div class="course-info">
                    <h3>${course.title}</h3>
                    <p>${course.shortDesc}</p>
                    <div class="course-meta">
                        <span><i data-lucide="clock"></i> ${course.duration}</span>
                        <span><i data-lucide="file-text"></i> ${course.lessonsCount} занятий</span>
                        <span><i data-lucide="check-circle"></i> Тестирование</span>
                    </div>
                </div>
                <div class="course-actions">
                    <button class="action-btn" onclick="openCourse('${course.id}')"><i data-lucide="eye"></i></button>
                    <button class="action-btn delete"><i data-lucide="trash-2"></i></button>
                </div>
            </div>
        `).join('');

        lucide.createIcons();
    }

    // 3. Загрузка курсов
    async function loadCourses() {
        try {
            const response = await fetch('courses.json');
            allCourses = await response.json(); // Сохраняем в глобальную переменную
            renderCourses(allCourses); // Рендерим всё при первой загрузке
        } catch (error) {
            console.error("Ошибка загрузки курсов:", error);
            grid.innerHTML = `<p>Ошибка загрузки данных.</p>`;
        }
    }

    // 4. ЛОГИКА ЖИВОГО ПОИСКА
    searchInput.addEventListener('input', (e) => {
        const searchText = e.target.value.toLowerCase().trim();

        // Фильтруем массив по названию или описанию
        const filtered = allCourses.filter(course => {
            return course.title.toLowerCase().includes(searchText) ||
                course.shortDesc.toLowerCase().includes(searchText);
        });

        renderCourses(filtered);
    });

    // Функция выхода
    function logout() {
        localStorage.removeItem('currentUser');
        window.location.href = 'auth.html';
    }

    function openCourse(id) {
        localStorage.setItem('selectedCourseId', id);
        window.location.href = 'course-view.html';
    }

    loadCourses();

    const addCourseBtn = document.querySelector('.controls i[data-lucide="plus-circle"]');

if (user) {
    document.getElementById('user-name').textContent = `${user.lastName} ${user.firstName}`;
    
    // Если пользователь — студент, скрываем кнопку добавления курсов
    if (user.role === 'student' && addCourseBtn) {
        addCourseBtn.parentElement.style.display = 'none';
    }
}
</script>
</body>
</html>
